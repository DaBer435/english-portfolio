<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Portfolio Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Caveat:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a notebook lying on a stone-grey desk, UI kept quiet around it */
  --desk: #d9d5cc;
  --desk-edge: #bdb7ab;
  --ink: #1c2642;
  --ink-soft: #5d6274;
  --paper: #f7f2e7;
  --cover: #1f2d47;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --hand: "Caveat", "Bradley Hand", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 90% at 50% 42%, #e7e3db 0%, var(--desk) 55%, var(--desk-edge) 100%);
  color: var(--ink); font-family: var(--body); overflow: hidden;
  -webkit-font-smoothing: antialiased; touch-action: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
body::after { /* faint desk grain */
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding: max(18px, env(safe-area-inset-top)) 24px 0;
}
.brand { pointer-events: auto; line-height: 1.1; transition: opacity .6s; }
body.open .brand { opacity: 0; pointer-events: none; } /* the title is on the cover; give the open book the full height */
.brand h1 { font-family: var(--display); font-weight: 400; font-style: italic; font-size: 26px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.tools { display: flex; gap: 8px; pointer-events: auto; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(28,38,66,.16);
  background: rgba(250,248,243,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .2s;
}
.icon-btn:hover { background: #fff; transform: translateY(-1px); }
.icon-btn:focus-visible, .chip:focus-visible, .arrow:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="false"] .on, .icon-btn[aria-pressed="true"] .off { display: none; }

nav, .tools { transition: opacity .45s, transform .45s; }
body.reading:not(.reveal) nav { opacity: 0; transform: translate(-50%, 24px); pointer-events: none; }
body.reading:not(.reveal) .tools { opacity: 0; pointer-events: none; }
body.reading nav:focus-within { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
nav {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(760px, calc(100% - 32px));
}
#where {
  position: fixed; top: max(24px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 5;
  font-family: var(--display); font-style: italic; font-size: 16px; color: var(--ink-soft); white-space: nowrap; pointer-events: none;
}
.bar {
  display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px;
  background: rgba(250,248,243,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(28,38,66,.12); box-shadow: 0 8px 30px -12px rgba(30,30,40,.35); max-width: 100%;
}
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip, .arrow {
  border: 0; background: transparent; color: var(--ink); font: 500 13.5px/1 var(--body);
  padding: 10px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 8px; transition: background .2s, color .2s;
}
.chip .n { font-family: var(--display); font-weight: 400; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.chip:hover, .arrow:hover { background: rgba(28,38,66,.07); }
.chip[aria-current="true"] { background: var(--ink); color: #f7f2e7; }
.chip[aria-current="true"] .n { color: rgba(247,242,231,.7); }
.arrow { padding: 10px 12px; font-size: 16px; }
.arrow:disabled { opacity: .3; cursor: default; background: transparent; }

#hint {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 66px);
  font-family: var(--hand); font-size: 21px; color: var(--ink-soft); z-index: 4; pointer-events: none;
  padding: 4px 16px; border-radius: 999px; background: rgba(250,248,243,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: opacity .8s; white-space: nowrap;
}

#loader {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--desk);
  font-family: var(--display); font-style: italic; font-size: 20px; color: var(--ink-soft); transition: opacity .6s;
}
#loader.gone { opacity: 0; pointer-events: none; }

/* Magnifier: a small glass resting bottom-right; pick it up to read */
#lens {
  --s: 64px; --ring: calc(3px + var(--s) * .02);
  position: fixed; left: 0; top: 0; width: var(--s); height: var(--s); z-index: 6;
  transform: translate(-50%, -50%); transition: width .35s cubic-bezier(.3,.7,.2,1), height .35s cubic-bezier(.3,.7,.2,1), opacity .2s;
  cursor: grab; touch-action: none;
}
#lens.anim { transition: width .35s cubic-bezier(.3,.7,.2,1), height .35s cubic-bezier(.3,.7,.2,1), left .35s cubic-bezier(.3,.7,.2,1), top .35s cubic-bezier(.3,.7,.2,1), opacity .2s; }
#lens.held { pointer-events: none; }
#lens.docked:hover { --s: 70px; }
#lens.away { opacity: .35; }
#lens:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; border-radius: 50%; }
#lens .glass {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.55), rgba(226,233,242,.22) 55%, rgba(196,206,222,.32));
  box-shadow: 0 0 0 var(--ring) #26314b, 0 0 0 calc(var(--ring) + 1.5px) rgba(255,255,255,.4), 0 14px 30px -8px rgba(20,24,36,.55);
}
#lens canvas { width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .15s; }
#lens.mag canvas { opacity: 1; }
#lens .glass::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(110% 75% at 30% 12%, rgba(255,255,255,.28), rgba(255,255,255,0) 45%);
  box-shadow: inset 0 0 calc(var(--s) * .06) rgba(20,30,50,.25);
}
#lens .handle {
  position: absolute; left: calc(50% - var(--s) * .07); top: 50%; width: calc(var(--s) * .14); height: calc(var(--s) * .48);
  transform-origin: 50% 0; transform: rotate(-45deg) translateY(calc(var(--s) * .5 + var(--ring) - 1px));
  border-radius: 0 0 calc(var(--s) * .07) calc(var(--s) * .07);
  background: linear-gradient(90deg, #172036, #3b4c70 45%, #1a2339); box-shadow: 0 8px 16px -6px rgba(20,24,36,.5);
}
#lens .handle::before { /* metal collar */
  content: ""; position: absolute; left: -8%; right: -8%; top: 0; height: 18%; border-radius: 3px;
  background: linear-gradient(90deg, #8d929c, #e3e5ea 45%, #8d929c);
}
#lensDock {
  position: fixed; width: 64px; height: 64px; border-radius: 50%; z-index: 5; transform: translate(-50%, -50%);
  border: 1.5px dashed rgba(28,38,66,.4); background: rgba(250,248,243,.55); cursor: pointer; display: none;
  font: 500 10px/1.15 var(--body); color: var(--ink-soft); text-align: center; padding: 0; place-items: center;
}
#lensDock.show { display: grid; }
#lensDock:hover { background: rgba(250,248,243,.9); }
@media (hover: none) { #lens, #lensDock { display: none !important; } }
#pageLink { position: fixed; z-index: 4; display: none; border-radius: 6px; cursor: pointer; }
#pageLink:hover, #pageLink:focus-visible { background: rgba(52,78,140,.10); outline: 2px solid rgba(52,78,140,.35); }
/* Zoom view */
#viewer {
  position: fixed; inset: 0; z-index: 30; background: rgba(22,26,36,.88); display: none;
  flex-direction: column; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#viewer.open { display: flex; }
.vbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; color: #efeadf; }
.vbar .t { font-family: var(--display); font-style: italic; font-size: 18px; }
.vbar .s { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; margin-top: 2px; }
.vbar .btns { display: flex; gap: 8px; }
.vbar .icon-btn { background: rgba(255,255,255,.1); color: #efeadf; border-color: rgba(255,255,255,.18); }
.vbar .icon-btn:hover { background: rgba(255,255,255,.2); }
#vscroll { flex: 1; overflow: auto; display: flex; padding: 0 16px 24px; }
#vimg {
  margin: auto; display: block; height: calc(100vh - 100px); width: auto; max-width: none;
  border-radius: 3px; box-shadow: 0 20px 60px rgba(0,0,0,.45); cursor: zoom-in;
}
#viewer.zoomed #vimg { height: auto; width: min(2800px, 200vw); cursor: zoom-out; }
#viewer:not(.zoomed) #vimg { max-width: calc(100vw - 32px); height: auto; max-height: calc(100vh - 100px); }

@media (max-width: 640px) {
  .brand h1 { font-size: 21px; }
  .chip .label-long { display: none; }
  #hint { font-size: 19px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 98px); }
  #where { top: auto; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px); font-size: 15px; }
}
@media (min-width: 641px) { .chip .label-short { display: none; } #where { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",

} }
</script>
</head>
<body>
<div id="loader">Opening the notebook…</div>
<div id="stage" aria-label="3D notebook. Click or drag the pages to turn them."></div>

<header>
  <div class="brand">
    <h1>English Portfolio</h1>
    <p>First term · 2º Bachillerato</p>
  </div>
  <div class="tools">
    <button class="icon-btn" id="zoomBtn" title="Open page full screen (Z)" aria-label="Open page full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
    <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Page sounds" aria-label="Page sounds">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>
    </button>
  </div>
</header>

<div id="lens" class="docked" role="button" tabindex="0" aria-label="Magnifier. Click to pick it up, Esc to put it back." title="Magnifier: click to pick it up (L)"><div class="handle"></div><div class="glass"><canvas></canvas></div></div>
<button id="lensDock" aria-label="Put the magnifier back">put<br>back</button>
<a id="pageLink" target="_blank" rel="noopener" aria-label="Open the full project in a new tab"></a>
<div id="where">Cover</div>
<div id="hint">Click the cover to open it</div>

<nav aria-label="Sections">
  <div class="bar">
    <button class="arrow" id="prevBtn" aria-label="Previous page">←</button>
    <div class="chips" id="chips"></div>
    <button class="arrow" id="nextBtn" aria-label="Next page">→</button>
  </div>
</nav>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Page viewer">
  <div class="vbar">
    <div><div class="t" id="vtitle"></div><div class="s" id="vsub"></div></div>
    <div class="btns">
      <button class="icon-btn" id="vprev" aria-label="Previous page">←</button>
      <button class="icon-btn" id="vnext" aria-label="Next page">→</button>
      <button class="icon-btn" id="vclose" aria-label="Close viewer">✕</button>
    </div>
  </div>
  <div id="vscroll"><img id="vimg" alt=""></div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------
   CONTENT. Sections follow the teacher's numbering (1 Cover … 7 Self-assessment).
   To add pages later: add hi-/lo-/xl-/orig- images and list it here.
------------------------------------------------------------------- */
const SECTIONS = [
  { num: 2, id: 'presentation', title: 'Personal Presentation', short: 'About me', color: '#b3a6cf',
    blurb: 'How my school year is going, in class and outside it.',
    pages: [
      { img: 'p15', title: 'School, sport and the future' },
    ] },
  { num: 3, id: 'routines', title: 'Daily Routines', short: 'Routines', color: '#93b39a',
    blurb: 'Notes from the talks we give in class, and my own project.',
    pages: [
      { img: 'p09', title: 'Talks: the lost Franklin expedition, the hidden ocean, addiction' },
      { img: 'p10', title: 'Talk: extreme environments · My space project' },
      { img: 'p10b', title: 'My project: A Human Civilization Beyond Earth',
        link: { url: 'https://a-human-civilization-beyond-earth.vercel.app/', rect: [0.2555, 0.865, 0.7945, 0.9328] } },
    ] },
  { num: 4, id: 'vocab', title: 'Vocabulary', short: 'Vocab', color: '#8ea9cb',
    blurb: 'New words and expressions, with my own definitions.',
    pages: [
      { img: 'p01', title: 'Vocabulary I' },
      { img: 'p02', title: 'Vocabulary II' },
    ] },
  { num: 5, id: 'grammar', title: 'Grammar', short: 'Grammar', color: '#d9a08a',
    blurb: 'Reported speech, comparatives and future forms: notes and practice.',
    pages: [
      { img: 'p03', title: 'Reported speech, sentences 1–15' },
      { img: 'p04', title: 'Reported speech, sentences 16–32' },
      { img: 'p05', title: 'Reported speech, sentences 33–40' },
      { img: 'p06', title: 'Textbook exercises & advanced comparatives' },
      { img: 'p08', title: 'Future forms: notes (29 October)' },
      { img: 'p11', title: 'Future forms: practice' },
    ] },
  { num: 6, id: 'pau', title: 'PAU Exercises', short: 'PAU', color: '#dfc06e',
    blurb: 'Exam-style practice, writings included.',
    pages: [
      { img: 'p07', title: 'Writing: a description (textbook p. 69)' },
      { img: 'p12', title: 'First-term exam review, part 1' },
      { img: 'p13', title: 'First-term exam review, part 2' },
      { img: 'p14', title: 'First-term exam review, part 3' },
    ] },
  { num: 7, id: 'self', title: 'Self-Assessment', short: 'Self', color: '#d9a3ad',
    blurb: 'What I did well, what I can improve, and a few words for you.',
    pages: [
      { img: 'p16', title: 'Looking back at the first term' },
    ] },
];

/* ---------------- Build the sequence of page faces ---------------- */
// Each section opens on a left-hand divider facing its first page on the right.
const faces = [{ type: 'contents' }];
for (const s of SECTIONS) {
  if (faces.length % 2 === 0) faces.push({ type: 'blank', section: s.id });
  s.dividerFace = faces.length;
  faces.push({ type: 'divider', section: s.id, sec: s });
  s.firstFace = faces.length;
  for (const p of s.pages) { p.face = faces.length; faces.push({ type: 'page', section: s.id, sec: s, ...p }); }
}
if (faces.length % 2) faces.push({ type: 'blank' });
faces.forEach((f, i) => (f.pageNo = i + 1));
const PAPER_LEAVES = faces.length / 2;

/* ---------------- Geometry constants ---------------- */
const W = 3.2, H = 4.2;              // page size (world units)
const EPS = 0.022;                    // sheet spacing in the stack
const N = PAPER_LEAVES + 1;           // leaves incl. front cover
const BASE = 0.06;                    // top of the back cover
const CT = 0.045;                     // cover thickness
const CW = W + 0.1, CH = H + 0.14;    // cover size
const RINGS = 15;
const NX = 40, NY = 14;
const TAB_L = 0.27, TAB_SPAN = 0.5, TAB_STEP = 0.56, TAB_Z0 = -H / 2 + 0.28;
const yR = i => BASE + (N - i) * EPS;
const yL = i => BASE + (i + 1) * EPS;

/* ---------------- Renderer & scene ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xfff4e6, 2.1);
key.position.set(-3.5, 10, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 6, bottom: -6, near: 1, far: 25 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015; key.shadow.radius = 4;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc0, 0.55));

const book = new THREE.Group();
scene.add(book);

// Desk shadow catcher + soft contact shadow
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const contact = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.filter = 'blur(26px)'; g.fillStyle = 'rgba(40,32,24,0.55)'; g.fillRect(48, 48, 160, 160);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.002; book.add(m); return m;
})();

/* ---------------- Asset loading ---------------- */
const images = { hi: {}, lo: {} };
function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function getImg(res, name) {
  if (!images[res][name]) images[res][name] = loadImg(`${res}-${name}.webp`);
  return images[res][name];
}

/* ---------------- Canvas page painting ---------------- */
// high-res pages match the size they reach on screen in the reading view
// full-resolution pages on larger screens: drawn 1:1 from the source, no resampling in the browser
const TEX_W = { hi: Math.max(innerWidth, innerHeight) > 900 ? 1600 : 1024, lo: 300 };
const RATIO = H / W;
const secById = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)));
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function spaced(ctx, txt, x, y, sp) { // letter-spaced text without relying on ctx.letterSpacing
  for (const ch of txt) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + sp; }
  return x;
}
function wrap(ctx, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; } else line = test;
  }
  ctx.fillText(line, x, y); return y;
}
function leader(ctx, x1, x2, y, k) {
  ctx.save(); ctx.fillStyle = 'rgba(28,38,66,.28)';
  for (let x = x1; x < x2; x += 14 * k) ctx.fillRect(x, y - 2 * k, 3 * k, 3 * k);
  ctx.restore();
}
function tape(ctx, x, y, w, h, color, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); const z = h / 8;
  ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, -h / 2);

  if (tab) cursor = 'pointer';
  else if (p && Math.abs(p.z) < CH / 2 && Math.abs(p.x) < W + 0.1) {
    cursor = 'grab';
    if (!lens.on || e.pointerType !== 'mouse') {
      if (p.x > W * 0.72 && n < leaves.length && n > 0) peekLeaf = leaves[n];
      if (p.x < -W * 0.72 && n > 1) peekLeaf = leaves[n - 1];
    }
  }
  canvasEl.style.cursor = lens.on ? 'none' : cursor;
  for (const L of leaves) {
    const want = L === peekLeaf && !L.flying ? 1 : 0;
    if (L.peekTarget !== want) { L.peekTarget = want; L.active = true; }
  }
}

addEventListener('pointermove', e => {
  const near = e.clientY > innerHeight - 140 || (e.clientX > innerWidth - 170 && e.clientY < 100);
  document.body.classList.toggle('reveal', near);
});
addEventListener('keydown', e => {
  if (viewer.classList.contains('open')) {
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowRight') viewerStep(1);
    if (e.key === 'ArrowLeft') viewerStep(-1);
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { sound.unlock(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { sound.unlock(); prev(); }
  if (e.key === 'z' || e.key === 'Z') openViewer();
  if (e.key === 'l' || e.key === 'L') lens.toggle();
  if (e.key === 'Escape' && lens.on) lens.drop();
  if (e.key === 'Home') goTo(0);
});

/* ---------------- UI ---------------- */
const chipsEl = document.getElementById('chips');
const chipEls = {};
for (const s of SECTIONS) {
  const b = document.createElement('button'); b.className = 'chip'; b.style.setProperty('--c', s.color);
  b.innerHTML = `<span class="dot"></span><span class="n">${s.num}</span><span class="label-long">${s.title}</span><span class="label-short">${s.short}</span>`;
  b.addEventListener('click', () => { sound.unlock(); goToSection(s); });
  chipsEl.appendChild(b); chipEls[s.id] = b;
}
function goToSection(s) { goTo((s.dividerFace - 1) / 2 + 2); }
document.getElementById('prevBtn').addEventListener('click', () => { sound.unlock(); prev(); });
document.getElementById('nextBtn').addEventListener('click', () => { sound.unlock(); next(); });

const whereEl = document.getElementById('where'), hintEl = document.getElementById('hint');
function spreadFaces(n) {
  return { left: n >= 2 ? 2 * (n - 2) + 1 : -1, right: n >= 1 && n - 1 < PAPER_LEAVES ? 2 * (n - 1) : -1 };
}
let hintTimer = 0, openedOnce = false;
function afterNav() {
  const n = targetCount();
  const { left, right } = spreadFaces(n);
  const sec = (left >= 0 && faces[left].section) || (right >= 0 && faces[right].section) || null;
  document.body.classList.toggle('open', n > 0);
  for (const id in chipEls) chipEls[id].setAttribute('aria-current', String(id === sec));
  if (sec) { const c = chipEls[sec]; chipsEl.scrollTo({ left: c.offsetLeft - chipsEl.clientWidth / 2 + c.clientWidth / 2, behavior: 'smooth' }); }
  let label;
  if (n === 0) label = 'Cover';
  else if (n === 1) label = 'Contents';
  else if (n === leaves.length) label = `Page ${faces[left].pageNo} · end of the notebook`;
  else if (portrait) { const f = faces[focus === 'L' ? left : right]; label = `Page ${f.pageNo}` + (f.section ? ` · ${secById[f.section].title}` : ''); }
  else label = `Pages ${faces[left].pageNo}–${faces[right].pageNo}` + (sec ? ` · ${secById[sec].title}` : '');
  whereEl.textContent = label;
  document.getElementById('prevBtn').disabled = n === 0;
  document.getElementById('nextBtn').disabled = n === leaves.length;
  if (portrait && n === 1) focus = 'R';
  if (n > 0 && !openedOnce) {
    openedOnce = true; hintEl.textContent = portrait ? 'Tap the right side to read on' : 'Drag a corner or use ← →  ·  sections are at the bottom';
    clearTimeout(hintTimer); hintTimer = setTimeout(() => (hintEl.style.opacity = 0), 6000);
  }
  setTimeout(refreshHi, 250);
}

/* ---------------- Zoom viewer ---------------- */
const viewer = document.getElementById('viewer'), vimg = document.getElementById('vimg');
const pageList = faces.filter(f => f.type === 'page');
let vIndex = 0;
function openViewer() {
  const n = targetCount(); const { left, right } = spreadFaces(n);
  const order = portrait && focus === 'R' ? [right, left] : [left, right];
  let f = order.find(i => i >= 0 && faces[i].type === 'page');
  if (f === undefined) { const nxt = pageList.find(p => p.pageNo - 1 > Math.max(left, right)) || pageList[pageList.length - 1]; f = nxt.pageNo - 1; }
  vIndex = Math.max(0, pageList.findIndex(p => p.pageNo - 1 === f));
  viewer.classList.add('open'); viewer.classList.remove('zoomed'); showViewer();
  document.getElementById('vclose').focus();
}
function showViewer() {
  const p = pageList[vIndex];
  vimg.src = `orig-${p.img}.webp`; vimg.alt = p.title;
  document.getElementById('vtitle').textContent = p.title;
  document.getElementById('vsub').textContent = `${p.sec.num} · ${p.sec.title} · page ${p.pageNo}`;
  document.getElementById('vprev').disabled = vIndex === 0;
  document.getElementById('vnext').disabled = vIndex === pageList.length - 1;
}
function viewerStep(d) { vIndex = Math.max(0, Math.min(pageList.length - 1, vIndex + d)); viewer.classList.remove('zoomed'); showViewer(); }
function closeViewer() {
  viewer.classList.remove('open');
  const p = pageList[vIndex]; goTo(Math.floor(p.pageNo / 2) + 1); // jump the notebook to the page you were reading
}
document.getElementById('zoomBtn').addEventListener('click', openViewer);
document.getElementById('vclose').addEventListener('click', closeViewer);
document.getElementById('vprev').addEventListener('click', () => viewerStep(-1));
document.getElementById('vnext').addEventListener('click', () => viewerStep(1));
vimg.addEventListener('click', e => {
  const sc = document.getElementById('vscroll');
  const rx = e.offsetX / vimg.clientWidth, ry = e.offsetY / vimg.clientHeight;
  viewer.classList.toggle('zoomed');
  if (viewer.classList.contains('zoomed')) requestAnimationFrame(() => {
    sc.scrollLeft = rx * vimg.clientWidth - sc.clientWidth / 2; sc.scrollTop = ry * vimg.clientHeight - sc.clientHeight / 2;
  });
});
viewer.addEventListener('click', e => { if (e.target === viewer || e.target.id === 'vscroll') closeViewer(); });

/* ---------------- Paper sounds (synthesised, no files) ---------------- */
const sound = (() => {
  let ac = null, on = true, noise = null;
  const btn = document.getElementById('soundBtn');
  try { if (localStorage.getItem('nb-sound') === 'off') { on = false; btn.setAttribute('aria-pressed', 'false'); } } catch {}
  btn.addEventListener('click', () => {
    on = !on; btn.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('nb-sound', on ? 'on' : 'off'); } catch {}
  });
  function unlock() {
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noise = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
      const d = noise.getChannelData(0); let b = 0;
      for (let i = 0; i < d.length; i++) { b = 0.86 * b + 0.14 * (Math.random() * 2 - 1); d[i] = b * 2.4; }
    } catch { ac = null; }
  }
  function play(dur, f0, f1, vol, q) {
    if (!on || !ac || ac.state !== 'running') return;
    const t = ac.currentTime, src = ac.createBufferSource(); src.buffer = noise; src.playbackRate.value = 0.9 + Math.random() * 0.25;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.18); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(bp).connect(g).connect(ac.destination); src.start(t, Math.random() * 0.1); src.stop(t + dur + 0.05);
  }
  let lastSwish = 0, lastTap = 0;
  return {
    unlock,
    swish(s = 1) { const n = performance.now(); if (n - lastSwish < 60) return; lastSwish = n; play(0.42, 2600, 700, 0.11 * s, 0.6); },
    tap() { const n = performance.now(); if (n - lastTap < 60) return; lastTap = n; play(0.12, 900, 300, 0.07, 0.9); },
  };
})();

/* ---------------- Magnifier lens ----------------
   Raycasts the pointer onto the visible page, reads the texture coordinates there and
   draws that patch of the page's own high-res image, about 2.5x larger than on screen. */
let busyNow = false;
const lens = (() => {
  const el = document.getElementById('lens'), cv = el.querySelector('canvas'), g = cv.getContext('2d');
  const dock = document.getElementById('lensDock');
  const xlCache = {};
  function getXL(name) {
    if (!xlCache[name]) {
      const im = new Image(); xlCache[name] = { im, ok: false };
      im.onload = () => { xlCache[name].ok = true; if (api.on && !busyNow) api.draw(); };
      im.src = `xl-${name}.webp`;
    }
    return xlCache[name].ok ? xlCache[name].im : null;
  }
  const pageMeshes = () => [...cover.pivot.children, ...leaves.slice(1).flatMap(L => [L.front, L.back])];
  const api = { on: false, zoom: 2.5, visible: false, last: null, overBook: false };
  const size = () => Math.round(Math.min(340, Math.max(220, Math.min(innerWidth, innerHeight) * 0.34)));
  // resting spot: bottom-right corner, lifted above the section bar on narrower screens
  const dockPos = () => ({ x: innerWidth - 64, y: innerHeight - (innerWidth < 1100 ? 140 : 64) });
  function place(x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
  function animate() { el.classList.add('anim'); clearTimeout(api._t); api._t = setTimeout(() => el.classList.remove('anim'), 380); }
  function placeDock() {
    const d = dockPos();
    if (!api.on) place(d.x, d.y);
    dock.style.left = d.x + 'px'; dock.style.top = d.y + 'px';
  }
  api.pickUp = (x, y) => {
    if (api.on) return; api.on = true;
    api.last = { x: x ?? innerWidth / 2, y: y ?? innerHeight / 2 };
    api.overBook = true;
    el.classList.remove('docked'); el.classList.add('held'); el.style.setProperty('--s', size() + 'px');
    animate(); place(api.last.x, api.last.y); dock.classList.add('show');
    api.draw();
  };
  api.drop = () => {
    if (!api.on) return; api.on = false;
    el.classList.remove('held', 'mag', 'away'); el.classList.add('docked'); el.style.removeProperty('--s');
    animate(); placeDock(); dock.classList.remove('show'); api.visible = false;
    canvasEl.style.cursor = '';
  };
  api.toggle = () => (api.on ? api.drop() : api.pickUp(api.last?.x, api.last?.y));
  api.hide = () => { if (api.visible) { el.classList.remove('mag'); api.visible = false; } };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); api.pickUp(e.clientX, e.clientY); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); api.pickUp(); } });
  dock.addEventListener('click', e => { e.stopPropagation(); api.drop(); });
  addEventListener('resize', placeDock); placeDock();
  // while held, the glass follows the pointer anywhere on the screen
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    api.last = { x: e.clientX, y: e.clientY }; api.overBook = e.target === canvasEl;
    if (api.on) { el.classList.remove('away'); place(e.clientX, e.clientY); if (!busyNow) api.draw(); }
  });
  document.addEventListener('mouseleave', () => { if (api.on) el.classList.add('away'); api.hide(); });
  const v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
  api.draw = () => {
    const pt = api.last; if (!api.on || !pt) return;
    if (busyNow || !api.overBook || viewer.classList.contains('open')) return api.hide();
    camera.updateMatrixWorld();
    ndc.set(pt.x / innerWidth * 2 - 1, -(pt.y / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hitP = ray.intersectObjects(pageMeshes(), false)[0];
    if (!hitP || !hitP.uv) return api.hide();
    const leaf = leaves.find(L => L.front === hitP.object || L.back === hitP.object);
    const poster = hitP.object === cover.inner; // the WANTED poster inside the cover
    if (!leaf && !poster) return api.hide(); // the outside of the cover is in the way
    const isFront = !poster && hitP.object === leaf.front;
    const tex = hitP.object.material.map; if (!tex || !tex.image) return api.hide();
    const face = poster ? { type: 'poster' } : faces[isFront ? leaf.faceF : leaf.faceB];
    const xl = face.type === 'page' ? getXL(face.img) : null; // sharper source for handwriting
    const img = xl || tex.image, tw = img.width, th = img.height;
    const u = isFront ? hitP.uv.x : 1 - hitP.uv.x, v = 1 - hitP.uv.y;
    // how many screen pixels one source pixel covers right now, measured along the page height
    const span = poster ? CH : H;
    v1.copy(hitP.point); v1.z = -span / 2; v2.copy(hitP.point); v2.z = span / 2;
    v1.project(camera); v2.project(camera);
    const s = (Math.abs(v1.y - v2.y) / 2 * innerHeight) / th;
    const D = size(), dpr = Math.min(devicePixelRatio, 2);
    if (cv.width !== D * dpr) cv.width = cv.height = D * dpr;
    const R = D / (2 * api.zoom * s); // half-size of the patch in source pixels
    g.fillStyle = '#f7f2e7'; g.fillRect(0, 0, cv.width, cv.height);
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, u * tw - R, v * th - R, 2 * R, 2 * R, 0, 0, cv.width, cv.height);
    if (!api.visible) { el.classList.add('mag'); api.visible = true; }
  };
  // scroll to change the zoom while holding the glass
  addEventListener('wheel', e => {
    if (!api.on) return;
    e.preventDefault();
    api.zoom = Math.max(1.5, Math.min(4.5, api.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    api.draw();
  }, { passive: false });
  return api;
})();

/* links printed on a page get a real <a> laid exactly over them once the page lies still */
const pageLinkEl = document.getElementById('pageLink'), lv = new THREE.Vector3();
function placePageLink(busy) {
  camera.updateMatrixWorld();
  const n = targetCount(), { left, right } = spreadFaces(n);
  let shown = false;
  if (!busy && n > 0 && !viewer.classList.contains('open')) for (const f of [left, right]) {
    if (f < 0 || !faces[f].link) continue;
    const leaf = leaves[Math.floor(f / 2) + 1], isLeft = f % 2 === 1, [u0, v0, u1, v1] = faces[f].link.rect;
    const y = leaf.pivotY() + 0.001, X = u => isLeft ? -W + u * W : u * W, Z = v => -H / 2 + v * H;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [u, v] of [[u0, v0], [u1, v0], [u0, v1], [u1, v1]]) {
      lv.set(X(u) + book.position.x, y, Z(v)).project(camera);
      const px = (lv.x + 1) / 2 * innerWidth, py = (1 - lv.y) / 2 * innerHeight;
      x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
    }
    Object.assign(pageLinkEl.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px', display: 'block' });
    if (pageLinkEl.href !== faces[f].link.url) pageLinkEl.href = faces[f].link.url;
    shown = true; break;
  }
  if (!shown && pageLinkEl.style.display !== 'none') pageLinkEl.style.display = 'none';
}

/* ---------------- Loop ---------------- */
let last = performance.now();
function frame(tms) {
  const dt = Math.min(0.033, (tms - last) / 1000); last = tms; now = tms / 1000;
  for (const L of leaves) if (L.active || L.dragging) stepLeaf(L, dt);
  updateStacks();
  // book slides so the closed cover is centred and the open spread is centred
  const open = cover.t;
  book.position.x = -CW / 2 * (1 - open) * (1 - open * 0.0);
  contact.scale.set(CW * (1 + open) + 0.5, 1, CH + 0.5);
  contact.position.x = CW / 2 - open * CW / 2;
  // camera: gentle parallax towards the pointer
  lookS.x += (look.x - lookS.x) * Math.min(1, dt * 3); lookS.y += (look.y - lookS.y) * Math.min(1, dt * 3);
  // while a page is in the air the camera eases back and tilts a little, then settles close again to read
  let fly = 0;
  for (const L of leaves) if (L.flying || L.dragging) fly = Math.max(fly, Math.sin(Math.PI * L.t) * (L.i === 0 ? 0.7 : 1));
  flyS += (fly - flyS) * Math.min(1, dt * (fly > flyS ? 5 : 1.8));
  const tilt = TILT0() + THREE.MathUtils.degToRad(8 * flyS + lookS.y * 2.5), yaw = lookS.x * 0.04;
  const d = fitDist * (1 + 0.14 * flyS), nOpen = targetCount();
  const wantX = portrait && nOpen > 0 ? (focus === 'L' ? -W / 2 - 0.05 : W / 2 + 0.05) : 0;
  camX += (wantX - camX) * Math.min(1, dt * 4);
  // once every page has landed, glide into the reading view; any page movement pulls back out
  const busy = leaves.some(L => L.flying || L.dragging || Math.abs(L.t - L.target) > 0.002);
  busyNow = busy;
  if (busy) lens.hide(); else if (lens.on && (readS < 0.999 || !lens.visible)) lens.draw(); // follow the camera as it settles
  if (busy || nOpen === 0) settledAt = now;
  const readT = !busy && nOpen > 0 && now - settledAt > 0.15 ? 1 : 0;
  readS += (readT - readS) * Math.min(1, dt * (readT ? 2.4 : 6));
  const e = readS * readS * (3 - 2 * readS);
  placeCam(camX, d, tilt, yaw, fitZ);
  if (e > 0.0001) {
    const P = camera.position.clone(), T = new THREE.Vector3(camX, 0.2, fitZ);
    const RP = new THREE.Vector3(camX, 0.3 + readDist, 0.0001), RT = new THREE.Vector3(camX, 0.3, 0);
    camera.position.lerpVectors(P, RP, e); camera.lookAt(T.lerp(RT, e));
  }
  placePageLink(busy);
  const reading = e > 0.6 && !portrait;
  if (reading !== document.body.classList.contains('reading')) document.body.classList.toggle('reading', reading);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

for (const L of leaves) L.update();
initTextures().then(() => {
  if (portrait) hintEl.textContent = 'Tap the cover to open it';
  afterNav();
  document.getElementById('loader').classList.add('gone');
  requestAnimationFrame(frame);
  refreshHi();
});
</script>
</body>
</html>
